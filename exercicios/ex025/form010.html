<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php">
        <p>
            <label for="iano">Em que ano voce naceu? </label>
            <input type="number" name="ano" id="iano" min="1900" max="2030" value="2000" oninput="calc()">
        </p>
        <p>
            <label for="iidade">Sua idade e:</label>
            <output id="iidade" ></output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    <script>
        function calc() {
        let atual = new Date().getFullYear()
        iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
