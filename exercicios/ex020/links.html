<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando links</title>
    <style>
        body {
          font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

        }
        a {
          color: red;
          text-decoration: none;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            text-decoration: underline;
            color: black;
        }
        a:active {
            color: yellow;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="...">Repositorio github</a></li>
        <li><a href="...">Canal do youtube</a></li>
        <li><a href="...">Site do Curso em video</a></li>
    </ul>
</body>
</html>
