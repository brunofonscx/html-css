<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        color: rgb(255, 255, 255);
        background-color: rgb(46, 82, 80);
    }
        
        h1 {
            border-radius: 8px;
            width: 280px;
            margin: auto;
            color: rgb(0, 0, 0);
            background-color: rgb(34, 214, 214);
        text-align: center;
    }
    div > p {
        display: none;
    }
    div:hover > p {
        display: block;
        background-color: red;
        color: white;
        text-align: center;
        width: 200px;
        margin: auto;
        border-radius: 10px;
    }
    div:hover {
        color: red;
    }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>
         Passe o mouse aqui
        <p>Texto escondido...</p>
    </div>
</body>
</html>
