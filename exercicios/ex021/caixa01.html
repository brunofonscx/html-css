<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        html {
            background-color: rgb(145, 145, 145);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        h1 {
        background-color: lightcoral;
        width: 300px;
        height: 300px;
        text-align: center;


                /* border */
        border: 10px, solid, crimson;


                /* padding */
        padding: 10px;


                /* margin */
        margin: auto;

        
        outline: 5px dashed rgb(230, 0, 192);   
        }     
    a {
        border-width: 2px;
        border-style: dashed;
        border-color: darkred;
    
    }

    </style>
</head>
<body>
    <h1>Exemplos de caixas</h1>
    <p>Paragrafos tambem sao exemplos de box-level, mais os <a href="#">Links sao exemplos de caixas inline level</a>. Vamos ver como tudo isso funciona</p>
</body>
</html>
